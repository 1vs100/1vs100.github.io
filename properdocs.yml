site_name: 1vs100 Reborn Docs
site_description: How to play 1 vs 100 again on Xbox 360, PC, or Xbox One / Series.
site_url: https://docs.1vs100.fans
repo_url: https://github.com/1vs100/1vs100.github.io
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css
exclude_docs: 'superpowers/**'

theme:
  name: materialx
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - content.action.view
    - content.action.edit
  palette:
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.highlight
  - pymdownx.inlinehilite

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Play:
      - Platforms: platforms.md
      - Xbox 360: xbox-360.md
      - PC: pc.md
      - Xbox One / Series: xbox-one-series.md
      - Game files: game-files.md
  - Help:
      - FAQ: faq.md
  - About: about.md
